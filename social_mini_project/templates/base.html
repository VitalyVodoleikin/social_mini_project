<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Социальная мини‑платформа{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'posts:post_list' %}">MiniSocial</a>

            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <span class="nav-item nav-link text-white me-3">Привет, {{ user.username }}</span>

                    <!-- Кнопка «Создать пост» -->
                    <a href="{% url 'posts:post_create' %}" class="btn btn-sm btn-outline-light me-3">Создать пост</a>

                    <!-- Кнопка «Выйти» через форму -->
                    <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-sm btn-danger"
                                style="padding: 6px 12px;">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
