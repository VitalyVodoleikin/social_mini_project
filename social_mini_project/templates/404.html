<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена — 404</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .error-code {
            font-size: 10rem;
            font-weight: bold;
            color: #dc3545;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'posts:post_list' %}">MiniSocial</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-item nav-link text-white">Привет, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'users:logout' %}">Выйти</a>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container error-container">
        <div class="error-code">404</div>
        <h1>Страница не найдена</h1>
        <p>Кажется, такой страницы не существует. Возможно, ссылка устарела или вы ошиблись в адресе.</p>

        <div style="margin-top: 2rem;">
            <a href="{% url 'posts:post_list' %}" class="btn btn-primary btn-lg">Вернуться к ленте постов</a>
        </div>
    </div>
</body>
</html>
