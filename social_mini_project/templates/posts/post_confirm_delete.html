{% extends "base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
  <h1>Подтверждение удаления</h1>
  <p>Вы уверены, что хотите удалить пост «{{ post }}»?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="color: red;">Да, удалить</button>
    <a href="{% url 'posts:post_detail' post.pk %}" class="btn">Отмена</a>
  </form>
{% endblock %}
