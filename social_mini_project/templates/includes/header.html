{%load static %}

{% with request.resolver_match.view_name as view_name %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'posts:post_list' %}">MiniSocial</a>

            <div class="navbar-nav ms-auto align-items-center">

                <!-- Кнопка "Пользователи" -->
                <a href="{% url 'users:profiles' %}" class="btn btn-sm btn-outline-light me-3">
                   Пользователи
                </a>

                <!-- Кнопка "Посты" -->
                <a href="{% url 'posts:post_list' %}" class="btn btn-sm btn-outline-light me-3">
                    Посты
                </a>
                
                <!-- Кнопка "О проекте" -->
                <a href="{% url 'pages:about' %}" class="btn btn-sm btn-outline-light me-3">
                    О проекте
                </a>

                <!-- Кнопка "Контакты" -->
                <a href="{% url 'pages:contacts' %}" class="btn btn-sm btn-outline-light me-3">
                    Контакты
                </a>

                {% if user.is_authenticated %}
                    <span class="nav-item nav-link text-white me-3">Привет, {{ user.username }}</span>

                    <!-- Кнопка «Создать пост» -->
                    <a href="{% url 'posts:post_create' %}" class="btn btn-sm btn-outline-light me-3">
                        Создать пост
                    </a>

                    <!-- Кнопка «Выйти» через форму -->
                    <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-sm btn-danger"
                                style="padding: 6px 12px;">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">
                        Войти
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>
{% endwith %}
