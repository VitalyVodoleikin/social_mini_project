{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
  <h1>Регистрация</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
  <p>
    <a href="{% url 'users:login' %}" class="btn btn-outline-secondary">Уже есть аккаунт? Войти</a>
  </p>
{% endblock %}
